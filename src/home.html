<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nusa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/home.css">
</head>
<body>

  <!-- Top Bar: Brand, Center Mascot Notch, Window Controls -->
  <header class="bar" id="appBar">
    <a class="brand" href="#" id="brandLogo">
      <img src="assets/nusa-icon.png" alt="Nusa Logo" class="brand-img">
      <span class="brand-name">Nusa</span>
    </a>

    <!-- Living Mascot Notch centered at the top border -->
    <div class="mascot" id="mascotNotch" title="Nusa living notch">
      <div class="ambient"></div>
      <div class="eyes">
        <span class="eye"></span>
        <span class="eye"></span>
      </div>
    </div>

    <!-- Window Control Buttons Only (No navbar) -->
    <div class="win-controls">
      <button class="win-btn" id="btnMin" title="Minimize">
        <svg viewBox="0 0 12 12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="win-btn" id="btnMax" title="Maximize / Restore">
        <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
      </button>
      <button class="win-btn close" id="btnClose" title="Close">
        <svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <main class="hero-wrap">
    <div class="hero">
      <!-- Pill Badge -->
      <div class="soon">Coming soon to Windows 10 and 11</div>

      <!-- Main Headline -->
      <h1 class="hero-title">The top of your<br>screen, alive.</h1>

      <!-- Subtitle Description -->
      <p class="lede">Nusa turns the top edge of Windows into a small notch that shows your music, synced lyrics, timers and files, then quietly gets out of the way.</p>

      <!-- Action Hub -->
      <div class="cta-hub">
        <!-- Big Glowing Launch Button -->
        <button class="btn btn-launch" id="btnLaunchNotch">
          <svg viewBox="0 0 24 24" class="btn-icon">
            <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86a1 1 0 0 0-1.5.86z"/>
          </svg>
          <span class="btn-label">Mulai Nusa Sekarang</span>
        </button>

        <!-- Symmetrical Controls Row -->
        <div class="controls-row">
          <!-- 1. Auto-Start Checkbox -->
          <label class="ctrl-pill" for="toggleAutoStart" title="Jalankan otomatis saat laptop/PC dinyalakan">
            <input type="checkbox" id="toggleAutoStart" class="nusa-switch">
            <span class="pill-checkbox">
              <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span class="pill-text">Jalankan otomatis saat device dinyalakan</span>
          </label>

          <!-- 2. Check Update Button -->
          <button class="ctrl-pill btn-update" id="btnCheckUpdate" title="Periksa pembaruan rilis terbaru">
            <span class="update-icon">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8m0 0V3m0 5h5M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16m0 0v5m0-5h-5"/>
              </svg>
            </span>
            <span class="pill-text" id="updateStatusText">Cek Update (v1.0.0)</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script src="scripts/home.js"></script>
</body>
</html>
