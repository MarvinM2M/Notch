<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nusa Setup</title>
  <link rel="stylesheet" href="installer.css">
</head>
<body>

  <div class="installer-box">
    <!-- Nusa Ambient Wall & Petals Background -->
    <div class="wall">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="shine"></div>
    </div>

    <!-- Living Mascot Notch -->
    <div class="mascot">
      <div class="ambient"></div>
      <div class="eyes">
        <span class="eye"></span>
        <span class="eye"></span>
      </div>
    </div>

    <!-- Content Card -->
    <div class="installer-content">
      <!-- Main Heading -->
      <div class="header-section">
        <div class="brand-badge">Nusa Edition</div>
        <h1 class="installer-title">Memasang Nusa</h1>
        <p class="installer-subtitle">Menyiapkan notch di desktop Anda...</p>
      </div>

      <!-- Progress Section -->
      <div class="progress-section">
        <div class="progress-header">
          <span class="status-label" id="statusLabel">Memeriksa pembaruan...</span>
          <span class="percent-label" id="percentLabel">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- Footer Info -->
      <div class="footer-info">
        <span>Nusa for Windows</span>
        <span>v1.0.0</span>
      </div>
    </div>
  </div>

  <script src="installer.js"></script>
</body>
</html>
